<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      width: 220px;
      padding: 14px;
      margin: 0;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px 0;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    p {
      font-size: 11px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Auto Skip Ads</h1>
  <label>
    <input type="checkbox" id="toggle" />
    Enabled on YouTube
  </label>
  <p>Automatically clicks "Skip Ad" as soon as it appears.</p>
  <script src="popup.js"></script>
</body>
</html>
